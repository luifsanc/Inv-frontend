<div *ngIf="modalDialog.isOpen()" class="dialog-overlay">
  <div class="dialog-content" [ngClass]="type">
    <mat-icon>{{ type === 'success' ? 'check_circle' : 'error' }}</mat-icon>
    <h4>{{ title }}</h4>
    <p>{{ message }}</p>
    <button mat-button (click)="close()">Continuar</button>
  </div>
</div>
